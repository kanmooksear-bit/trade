# ตั้งค่าสำหรับ XAUUSD (ทองคำ) โบรก HFM ผ่าน MetaTrader 5 — ราคา 2 ตำแหน่ง (เช่น 2650.45)
# คัดลอกไปใช้:  copy config.xauusd.example.yaml config.yaml   (Windows)
#
# ขั้นตอนแนะนำ:
#   1) backtest ด้วยข้อมูลจำลอง:      data.source: synthetic   แล้ว  python -m autotrader -c config.yaml backtest --days 365
#   2) backtest ด้วยข้อมูลจริงจาก MT5:  data.source: mt5  (หรือ csv จากการ export ใน MT5)
#   3) paper trading กับราคาจริง:       data.source: mt5, broker.type: paper   แล้วรัน daemon
#   4) เงินจริง (หลังมั่นใจแล้ว):       mode: live, broker.type: mt5, storage.db_path: data/xauusd_live.db

mode: paper                     # live = ส่งคำสั่งจริงเข้า MT5

data:
  source: mt5                   # mt5 | csv | synthetic | yfinance (GC=F = ทองฟิวเจอร์ส ใช้แทนได้คร่าวๆ)
  timeframe: 1h                 # 1h แนะนำ; 1d สต็อปกว้างมาก ต้องใช้ทุนเยอะ (ดูคำสั่ง sizing)
  symbols: [XAUUSD]             # ชื่อต้องตรงกับใน Market Watch ของ MT5 (บางบัญชีมีตัวต่อท้าย)
  history_bars: 1200            # ต้องครอบคลุมช่วงทดสอบย้อนหลัง (whatif_bars) ด้วย
  csv_files:                    # ถ้าใช้ source: csv — ไฟล์ที่ export จาก MT5 (View > Symbols > Bars > Export)
    XAUUSD: data/csv/XAUUSD_H1.csv
  synthetic:                    # ข้อมูลจำลองแบบทอง (ทดสอบระบบโดยไม่ต้องต่อ MT5)
    start: "2021-01-01"
    start_price: 1800
    vol_scale: 0.6
    weekdays_only: true
    digits: 2

broker:
  type: paper                   # paper | mt5
  starting_cash: 1000           # ทุน (USD) ที่ "แบ่งให้บอท" — บอทคำนวณขนาดไม้จากยอดนี้
  contract_size: 100            # 1 lot = 100 ออนซ์ (ค่ามาตรฐาน XAUUSD; โหมด mt5 อ่านจากโบรกเอง)
  volume_min: 0.01
  volume_step: 0.01
  digits: 2                     # ทศนิยม 2 ตำแหน่ง
  spread: 0.35                  # สเปรด (USD) ใช้ในโหมด paper/backtest — ใส่ค่าจริงจาก MT5 (35 จุด = 0.35)
  commission_per_lot: 0.0       # บัญชี Premium = 0; บัญชีที่คิดค่าคอม ใส่ค่าต่อข้าง (ต่อ lot)
  fee_rate: 0.0
  slippage_bps: 0.3
  min_notional: 0
  allow_short: true             # CFD ทอง เปิด Sell ได้
  magic: 26100301               # เลขประจำคำสั่งของบอทใน MT5
  deviation_points: 30          # ยอมให้ราคาคลาดได้ 30 จุด (0.30 USD)

mt5:
  path: ""                      # ถ้าหา MT5 ไม่เจอ ใส่ path ของ terminal64.exe ของ HFM
  server: ""                    # ชื่อเซิร์ฟเวอร์ตามหน้าล็อกอิน MT5 (หรือ env MT5_SERVER)
  login_env: MT5_LOGIN          # เลขบัญชี — ตั้งเป็น environment variable
  password_env: MT5_PASSWORD    # รหัสผ่าน — ตั้งเป็น environment variable (ห้ามใส่ในไฟล์)
  server_env: MT5_SERVER

risk:
  risk_per_trade: 0.01          # เสียได้ 1% ของทุนต่อไม้ (ถ้าโดน SL)
  max_min_lot_risk: 0.02        # ถ้า 1% ต่ำกว่า 0.01 lot ยอมใช้ 0.01 lot ได้ถ้าเสี่ยงไม่เกิน 2%
  max_position_pct: 20          # มูลค่าสัญญา ÷ ทุน (= leverage สูงสุดต่อไม้)
  max_gross_exposure: 20
  max_open_positions: 1         # ทองตัวเดียว ถือทีละไม้
  daily_loss_limit: 0.03
  max_drawdown: 0.20
  min_score: 0.35

schedule:
  trade_every_day: true         # ทุกวันทำการ (จ.-ศ.) ต้องมีอย่างน้อย 1 ไม้
  probe_after_hour: 16          # ถ้าถึง 16:00 (เวลาเซิร์ฟเวอร์ MT5 ≈ ช่วงตลาด New York เปิด) ยังไม่มีไม้ จะเปิดไม้บังคับ
  probe_slots: 1
  probe_max_hold: 6             # ไม้บังคับถือไม่เกิน 6 แท่ง (6 ชั่วโมง)
  stop_check_minutes: 15        # MT5 วาง SL/TP บนเซิร์ฟเวอร์อยู่แล้ว นี่คือรอบตรวจว่าไม้ไหนถูกปิดไป
  poll_seconds: 30

learning:
  enabled: true
  evidence_required: 2          # สาเหตุเดิมต้องเกิดซ้ำกี่ครั้ง ถึงจะพิจารณาปรับ (กัน overfit)
  whatif: true                  # ก่อนปรับ: ทดสอบค่าใหม่กับข้อมูลย้อนหลัง ต้องดีกว่าชัดเจน และดีขึ้นทั้งสองครึ่ง
  whatif_bars: 1000             # จำนวนแท่งย้อนหลังที่ใช้ทดสอบ
  whatif_min_gain_r: 1.0        # ต้องดีขึ้นอย่างน้อยกี่ R
  probation_trades: 10          # หลังปรับ ดูผลจริงอีกกี่ไม้ ถ้าแย่ลงชัดเจนจะย้อนกลับเอง
  hindsight_bars: 8
  cooldown_bars: 24             # พักกลยุทธ์ที่แพ้ติดกัน 24 แท่ง (1 วัน)

llm_review:
  enabled: false                # true = ให้ Claude ช่วยวิเคราะห์ไม้ที่ขาดทุน (ต้องมี ANTHROPIC_API_KEY)
  model: claude-opus-5-5
  effort: medium
  apply_suggestions: false

storage:
  db_path: data/xauusd.db         # ตอนเปลี่ยนเป็นเงินจริง ให้ใช้ไฟล์ใหม่ เช่น data/xauusd_live.db
                                # (บอทไม่ยอมใช้ไฟล์เดียวกันข้ามโหมด paper/live)
